default_stages: [pre-commit]

repos:
  - repo: https://github.com/Woile/commitizen
    rev: v4.19.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
        args: [--unsafe] # allow custom tags such as compose's !reset
      - id: check-json
        exclude: ^frontend/tsconfig\.json$
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.9
    hooks:
      - id: prettier
        # html fixtures compared as-is with the parser output in the tests
        exclude: ^backend/caviardeul/tests/resources/

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        verbose: true
        language: system
        entry: yarn --cwd frontend run eslint
        pass_filenames: false
        files: .*\.tsx?$

  - repo: local
    hooks:
      - id: tsc
        name: tsc
        verbose: true
        language: system
        entry: yarn --cwd frontend/ run tsc --project tsconfig.json
        files: \.tsx?$
        pass_filenames: false
        stages: [pre-commit, pre-push]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix, --config=backend/pyproject.toml]
      - id: ruff-format
        args: [--config=backend/pyproject.toml]

  - repo: https://github.com/gitguardian/ggshield
    rev: v1.55.0
    hooks:
      - id: ggshield
        language_version: python3
        stages: [pre-commit, pre-push]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
