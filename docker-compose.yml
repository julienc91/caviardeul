services:
  frontend:
    image: ghcr.io/julienc91/caviardeul-frontend:latest
    pull_policy: always
    env_file:
      - frontend/.env
    depends_on:
      - backend
    networks:
      - nginx_network
    expose:
      - 3000
    healthcheck:
      # The standalone Next.js server listens on $$HOSTNAME, not on localhost
      test: wget -q --spider http://$$(hostname):3000/robots.txt
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2m
      start_interval: 2s
    restart: always

  backend:
    image: ghcr.io/julienc91/caviardeul-backend:latest
    pull_policy: always
    env_file:
      - backend/.env
    volumes:
      - staticdata:/app/static
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - db_network
      - nginx_network
    expose:
      - 5000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:5000/health', headers={'Host': os.environ['HOST_NAME']}), timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2m
      start_interval: 2s
    restart: always

  worker:
    image: ghcr.io/julienc91/caviardeul-backend:latest
    pull_policy: always
    env_file:
      - backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - db_network
    restart: always
    command: taskiq worker worker:broker

  scheduler:
    extends:
      service: worker
    command: taskiq scheduler worker:scheduler

  nginx:
    image: nginx:stable-alpine
    env_file:
      - nginx/.env
    volumes:
      - ./nginx/caviardeul.conf.template:/etc/nginx/templates/caviardeul.conf.template:ro
      - staticdata:/app/static:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - nginx_network
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:18-alpine
    env_file:
      - postgres/.env
    networks:
      - db_network
    expose:
      - 5432
    volumes:
      - "dbdata:/var/lib/postgresql/data"
    healthcheck:
      test: pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m
      start_interval: 2s
    restart: always

  redis:
    image: redis:8-alpine
    env_file:
      - redis/.env
    networks:
      - db_network
    expose:
      - 6379
    command: /bin/sh -c "redis-server --requirepass $$REDIS_PASSWORD"
    healthcheck:
      test: REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    restart: always

networks:
  db_network:
  nginx_network:

volumes:
  dbdata:
  staticdata:
